<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>꿀템저장소 — 영상 속 꿀템 모음</title>
<meta name="description" content="꿀템저장소 쇼츠에 나온 꿀템을 번호순으로 모았어요. 영상 번호를 찾아 쿠팡에서 확인하세요.">
<style>
  :root { --bg:#fffaf0; --card:#ffffff; --ink:#2b2118; --sub:#7a6a58; --line:#f0e4cf; --honey:#f5a623; --honey-ink:#3a2500; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1712; --card:#262019; --ink:#f4ece0; --sub:#b5a690; --line:#3a3127; --honey:#f5a623; --honey-ink:#2a1a00; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:22px; margin:4px 0 6px; }
  .lead { color:var(--sub); font-size:14px; margin:0 0 12px; line-height:1.5; }
  .disc { font-size:12px; color:var(--sub); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:14px; line-height:1.5; }
  input { width:100%; font-size:16px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); margin-bottom:14px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:grid; grid-template-columns:44px 1fr; gap:4px 12px; align-items:center; }
  .no { grid-row:span 2; width:44px; height:44px; border-radius:12px; background:var(--honey); color:var(--honey-ink); font-weight:800; display:grid; place-items:center; font-size:15px; }
  .name { font-weight:700; font-size:15px; line-height:1.35; }
  .acts { display:flex; gap:8px; flex-wrap:wrap; }
  .acts a { font-size:13px; text-decoration:none; padding:7px 12px; border-radius:999px; font-weight:700; }
  .buy { background:var(--honey); color:var(--honey-ink); }
  .vid { border:1px solid var(--line); color:var(--ink); }
  .new { font-size:11px; color:var(--honey); font-weight:800; margin-left:6px; }
  .empty { color:var(--sub); text-align:center; padding:24px 0; }
</style>
</head>
<body>
<main>
  <h1>🍯 꿀템저장소 꿀템 모음</h1>
  <p class="lead">영상 속 번호를 찾아 눌러 주세요. 최신 꿀템이 맨 위에 있어요.</p>
  <div class="disc">이 페이지의 쿠팡 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 가격·재고는 쿠팡에서 확인하세요.</div>
  <input id="q" type="search" placeholder="번호나 이름으로 찾기 (예: 7, 저울)" aria-label="꿀템 찾기">
  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>찾는 꿀템이 없어요.</p>
</main>
<script>
// 새 꿀템은 맨 위에 한 줄 추가: [번호, 이모지, 이름, 쿠팡 파트너스 링크, 유튜브 영상 ID]
const ITEMS = [
  [8, '☕', '홈플래닛 핸디형 전동 우유거품기', 'https://link.coupang.com/a/ir9SvCcDyS', '9kceLL9977E'],
  [7, '⚖️', '홈플래닛 디지털 주방저울 1kg', 'https://link.coupang.com/a/in4rBfp7Ey', 'ybXBUNbKyfU'],
  [6, '🥚', '키친아트 에그찜기', 'https://link.coupang.com/a/in4qAn923U', 'XoIM-L_k2_0'],
  [5, '🔥', '탐사 양면 디자인 핫팩 90g', 'https://link.coupang.com/a/in6hd69ihw', '-y_NNO6MSRg'],
  [4, '🏠', '몬스터겔 실리콘 양면테이프', 'https://link.coupang.com/a/in4s8VmgMK', 'Bmb0W2RP8Tg'],
  [3, '👖', '기모 부츠컷 바지', 'https://link.coupang.com/a/in6AY18u5Y', 'YCJXg47iV34'],
  [2, '👟', '깔창', 'https://link.coupang.com/a/inGeuaHHmC', '-uxJm2m9YDA'],
  [1, '🧥', '게스 페더라이트 베이직 푸퍼', 'https://link.coupang.com/a/inBmGyLqh2', 'UFvYxMdQRjQ'],
];
const list = document.getElementById('list'), empty = document.getElementById('empty');
function render(q) {
  q = q.trim().toLowerCase();
  const rows = ITEMS.filter(([n, e, name]) => !q || String(n) === q.replace('#', '') || name.toLowerCase().includes(q));
  list.innerHTML = rows.map(([n, e, name, buy, vid], i) => `
    <li><div class="no">#${n}</div>
      <div class="name">${e} ${name}${i === 0 && !q ? '<span class="new">NEW</span>' : ''}</div>
      <div class="acts"><a class="buy" href="${buy}" target="_blank" rel="sponsored noopener">쿠팡에서 보기</a>
        <a class="vid" href="https://www.youtube.com/shorts/${vid}" target="_blank" rel="noopener">영상 보기</a></div></li>`).join('');
  empty.hidden = rows.length > 0;
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
render('');
</script>
</body>
</html>
